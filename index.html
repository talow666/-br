<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d19"><title>Poker BR</title><style>
*{box-sizing:border-box}:root{--b:#090d19;--c:#141b2e;--l:#2b3550;--t:#f7f8fb;--m:#96a1b8;--p:#8b5cf6;--g:#34d399;--r:#fb7185}body{margin:0;background:linear-gradient(#090d19,#11182b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:14px 14px 90px}h1{font-size:21px;margin:4px 0 16px}h2{font-size:20px}.screen{display:none}.screen.on{display:block}.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:16px;margin-bottom:12px}.muted{color:var(--m);font-size:12px}.big{font-size:38px;font-weight:900;margin:4px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#0e1527;border:1px solid var(--l);border-radius:14px;padding:11px}.val{font-size:18px;font-weight:800}.good{color:var(--g)}.bad{color:var(--r)}button{font:inherit}.primary{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:white;font-weight:900;font-size:16px}label{display:block;color:var(--m);font-size:12px;margin-bottom:5px}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--l);background:#0d1425;color:white;font-size:16px}.field{margin:11px 0}.signs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.signs button{padding:12px;border:1px solid var(--l);border-radius:12px;background:#0d1425;color:white;font-weight:800}.signs .sel{border-color:var(--p)}.mascot{display:flex;gap:10px;align-items:center;background:#0e1527;border:1px solid var(--l);border-radius:16px;padding:10px;margin-top:13px}.avatar{width:72px;height:72px;border-radius:16px;object-fit:cover}.speech{font-size:13px;line-height:1.5}.prog{height:8px;border-radius:99px;background:#25304a;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--p);width:0}.item{display:flex;justify-content:space-between;gap:10px;align-items:center}nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#080d19f2;border-top:1px solid var(--l);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;color:#7f8aa5;font-size:10px;padding:5px 1px}nav button.sel{color:#ddd6fe}nav b{display:block;font-size:19px}.modal{display:none;position:fixed;inset:0;background:#030610ef;z-index:30;padding:18px;overflow:auto}.modal.on{display:block}.modalbox{max-width:500px;margin:18px auto;background:#0f172a;border:1px solid var(--l);border-radius:24px;padding:15px}.chars{display:grid;gap:12px}.char{background:var(--c);border:2px solid transparent;border-radius:18px;overflow:hidden}.char.sel{border-color:var(--p)}.char img{width:100%;height:140px;object-fit:cover;display:block}.pad{padding:12px}.char h3{margin:0 0 4px}.char button{width:100%;padding:10px;border:0;border-radius:12px;background:#28324d;color:white;font-weight:800;margin-top:8px}.char.sel button{background:#7c3aed}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:white;color:#111827;border-radius:99px;padding:9px 13px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:40}.toast.on{opacity:1}
</style></head><body><div class="app"><h1>Poker BR</h1>
<section id="home" class="screen on"><div class="card"><div class="muted">現在のバンクロール</div><div id="br" class="big">¥0</div><div class="grid"><div class="stat"><div class="muted">今日</div><div id="today" class="val">¥0</div></div><div class="stat"><div class="muted">今月</div><div id="month" class="val">¥0</div></div></div><div style="margin-top:14px"><div class="muted">目標BR <b id="pct" style="float:right">—</b></div><div class="prog"><i id="bar"></i></div><div id="remain" class="muted" style="margin-top:5px">目標未設定</div></div><div class="mascot"><img id="homeAv" class="avatar"><div id="homeSp" class="speech"></div></div></div><button class="primary" onclick="go('add')">＋ 収支を記録</button></section>
<section id="add" class="screen"><h2>収支を記録</h2><form id="form" class="card"><div class="signs"><button type="button" id="plus" class="sel">＋ 勝ち</button><button type="button" id="minus">− 負け</button></div><div class="field"><label>結果</label><input id="amt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="2500" required></div><div class="field"><label>ゲーム</label><select id="game"><option>Cash</option><option>MTT</option><option>SNG</option><option>Live</option><option>その他</option></select></div><div class="field"><label>プレイ場所（任意）</label><input id="place" placeholder="自由入力"></div><button class="primary">保存する</button></form></section>
<section id="history" class="screen"><h2>履歴</h2><div id="hist"></div></section>
<section id="analysis" class="screen"><h2>分析</h2><div class="grid"><div class="stat"><div class="muted">累計収支</div><div id="total" class="val">¥0</div></div><div class="stat"><div class="muted">勝率</div><div id="wr" class="val">N/A</div></div><div class="stat"><div class="muted">セッション</div><div id="cnt" class="val">0</div></div><div class="stat"><div class="muted">最大DD</div><div id="dd" class="val">¥0</div></div></div><div class="mascot"><img id="anaAv" class="avatar"><div id="anaSp" class="speech"></div></div></section>
<section id="settings" class="screen"><h2>設定</h2><div class="card"><div class="field"><label>開始バンクロール</label><input id="start" type="number" min="0"></div><div class="field"><label>目標バンクロール</label><input id="goal" type="number" min="0"></div><button id="saveSet" class="primary">保存</button></div><button class="primary" style="background:#26314d" onclick="openChars()">キャラクターを変更</button></section></div>
<nav><button data-n="home" class="sel" onclick="go('home')"><b>⌂</b>ホーム</button><button data-n="add" onclick="go('add')"><b>＋</b>記録</button><button data-n="history" onclick="go('history')"><b>≡</b>履歴</button><button data-n="analysis" onclick="go('analysis')"><b>⌁</b>分析</button><button data-n="settings" onclick="go('settings')"><b>⚙</b>設定</button></nav>

<script>
const $=x=>document.getElementById(x),K='pokerBR-v3',av={standard:$('c-standard').querySelector('img').src,cool:$('c-cool').querySelector('img').src,active:$('c-active').querySelector('img').src},ln={standard:['今月プラスだね！いい感じ！','焦らずいこう。まずは記録を続けよう。','今日の収支、記録しておこう！','ちゃんと記録すれば、もっと強くなれるよ。'],cool:['今月収支はプラスです。','ドローダウンを確認しましょう。','未記録のセッションがあれば入力してください。','データを増やすほど傾向が見えやすくなります。'],active:['ナイス！今月プラス！','まだまだここから！無理せずいこう！','今日もサクッと記録しよ！','続けて記録すれば成長が見えるよ！']};
let s={start:0,goal:0,char:null,e:[]},sg=1;try{let q=JSON.parse(localStorage.getItem(K)||'{}');s={...s,...q,e:Array.isArray(q.e)?q.e:[]}}catch(e){}
const save=()=>localStorage.setItem(K,JSON.stringify(s)),fmt=n=>(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP'),sum=()=>s.e.reduce((a,x)=>a+Number(x.a||0),0),bank=()=>Number(s.start||0)+sum();
function same(x,m){let d=new Date(x.t),n=new Date();return m==='d'?d.toDateString()===n.toDateString():d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()}function per(m){return s.e.filter(x=>same(x,m)).reduce((a,x)=>a+Number(x.a||0),0)}function maxdd(){let b=Number(s.start||0),p=b,m=0;[...s.e].sort((a,b)=>new Date(a.t)-new Date(b.t)).forEach(x=>{b+=Number(x.a);p=Math.max(p,b);m=Math.max(m,p-b)});return m}function paint(id,n){let e=$(id);e.textContent=fmt(n);e.className='val '+(n>0?'good':n<0?'bad':'')}
function render(){$('br').textContent=fmt(bank());paint('today',per('d'));paint('month',per('m'));paint('total',sum());$('cnt').textContent=s.e.length;$('wr').textContent=s.e.length?Math.round(s.e.filter(x=>x.a>0).length/s.e.length*100)+'%':'N/A';$('dd').textContent=fmt(maxdd());let g=Number(s.goal||0),p=g?Math.min(100,Math.max(0,bank()/g*100)):0;$('pct').textContent=g?Math.round(p)+'%':'—';$('bar').style.width=p+'%';$('remain').textContent=g?(bank()>=g?'目標達成！':fmt(g-bank())+' で到達'):'目標未設定';$('start').value=s.start||0;$('goal').value=s.goal||0;let c=s.char||'standard',m=per('m'),L=ln[c];$('homeAv').src=av[c];$('anaAv').src=av[c];$('homeSp').textContent=m>0?L[0]:m<0?L[1]:L[2];$('anaSp').textContent=L[3];hist();document.querySelectorAll('.char').forEach(x=>x.classList.remove('sel'));$('c-'+c).classList.add('sel')}
function hist(){let a=[...s.e].sort((x,y)=>new Date(y.t)-new Date(x.t));$('hist').innerHTML=a.length?a.map(x=>`<div class="card item"><div><b>${x.g}</b><div class="muted">${new Date(x.t).toLocaleString('ja-JP')}${x.p?' · '+x.p:''}</div></div><b class="${x.a>0?'good':'bad'}">${x.a>0?'+':''}${fmt(x.a)}</b></div>`).join(''):'<div class="card muted">まだ記録がありません。</div>'}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('sel',x.dataset.n===id));scrollTo(0,0)}function openChars(){$('modal').classList.add('on')}function choose(c){s.char=c;save();render();$('modal').classList.remove('on');toast('キャラクターを変更しました')}function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1200)}window.go=go;window.openChars=openChars;window.choose=choose;
$('plus').onclick=()=>{sg=1;$('plus').classList.add('sel');$('minus').classList.remove('sel')};$('minus').onclick=()=>{sg=-1;$('minus').classList.add('sel');$('plus').classList.remove('sel')};$('form').onsubmit=e=>{e.preventDefault();let v=Number($('amt').value||0);if(v<=0)return;s.e.push({t:new Date().toISOString(),a:sg*v,g:$('game').value,p:$('place').value.trim()});save();$('form').reset();sg=1;$('plus').classList.add('sel');$('minus').classList.remove('sel');render();toast('保存しました');go('home')};$('saveSet').onclick=()=>{s.start=Number($('start').value||0);s.goal=Number($('goal').value||0);save();render();toast('設定を保存しました')};render();if(!s.char)openChars();
</script></body></html>
